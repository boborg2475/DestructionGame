[/Script/UnrealEd.ProjectPackagingSettings]
; Functional-test maps are never cooked.
;
; AFunctionalTest is an actor serialised into a .umap, and its class lives in Epic's
; FunctionalTesting module, which Epic deliberately does not precompile for Shipping
; (Engine/Source/Developer/FunctionalTesting/FunctionalTesting.Build.cs sets
; PrecompileForTargets only when Target.Configuration != Shipping). A cooked map holding a
; placed AFunctionalTest therefore carries a dangling class reference into a Shipping build.
;
; Confining every such actor to one never-cooked folder makes that structurally impossible
; rather than something to remember. The matching rule -- functional-test actors may only be
; placed in maps under this folder -- is in CLAUDE.md and is what makes this line sufficient.
;
; The section name is /Script/UnrealEd.ProjectPackagingSettings even though the class moved to
; the DeveloperToolSettings module in UE5: UProjectPackagingSettings::OverrideConfigSection
; pins the legacy name for back-compat. Do not "correct" it to DeveloperToolSettings -- a
; section header the engine does not recognise is silently ignored, with no warning.
;
; DirectoriesToNeverCook is a long package path (or a path relative to /Game), not a filesystem
; path; the cooker feeds it to FPackageName::TryConvertGameRelativePackagePathToLocalPath.
+DirectoriesToNeverCook=(Path="/Game/Maps/FunctionalTests")
